<svg width="1360" height="675" viewBox="0 0 1360 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>

    <style>
      .axis { stroke:#555; stroke-width:1.8; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#888; stroke-width:1.2; stroke-dasharray:2 3; }
      .axislabel { font-family:Arial, Helvetica, sans-serif; fill:#222; font-size:18px; font-weight:600; }
      .catlabel { font-family:Arial, Helvetica, sans-serif; fill:#222; font-size:17px; font-weight:600; }
      .nodeText { font-family:Arial, Helvetica, sans-serif; fill:#444; font-size:14px; text-anchor:middle; dominant-baseline:middle; }
      .nodeTextSmall { font-family:Arial, Helvetica, sans-serif; fill:#444; font-size:13px; text-anchor:middle; dominant-baseline:middle; }
      .yellow { fill:#fff8dc; stroke:#e5c96b; stroke-width:2; }
      .pink { fill:#ffecec; stroke:#e7b7b7; stroke-width:2; }
      .blue { fill:#e6f0ff; stroke:#9dbbe5; stroke-width:2; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1360" height="675" fill="white"/>

  <!-- Plot area backgrounds -->
  <rect x="160" y="92" width="334" height="536" fill="#fff8dc" opacity="0.35"/>
  <rect x="494" y="92" width="328" height="536" fill="#ffecec" opacity="0.45"/>
  <rect x="822" y="92" width="342" height="536" fill="#e6f0ff" opacity="0.45"/>

  <!-- Axes -->
  <line class="axis" x1="160" y1="628" x2="1190" y2="628"/>
  <line class="axis" x1="160" y1="628" x2="160" y2="72"/>

  <!-- Horizontal separators -->
  <line class="dash" x1="160" y1="282" x2="1164" y2="282"/>
  <line class="dash" x1="160" y1="454" x2="1164" y2="454"/>

  <!-- Axis labels -->
  <text x="130" y="36" class="axislabel" text-anchor="middle">
    <tspan x="130" dy="0">Языковая</tspan>
    <tspan x="130" dy="26">вовлечённость</tspan>
  </text>

  <text x="1202" y="628" class="axislabel" text-anchor="start">Гранулярность</text>

  <!-- Y categories -->
  <text x="138" y="198" class="catlabel" text-anchor="end">Предложения</text>
  <text x="138" y="372" class="catlabel" text-anchor="end">Слова</text>
  <text x="158" y="556" class="catlabel" text-anchor="end">Только визуал</text>

  <!-- X categories -->
  <text x="327" y="653" class="catlabel" text-anchor="middle">Абстрактная</text>
  <text x="658" y="653" class="catlabel" text-anchor="middle">Временная</text>
  <text x="993" y="653" class="catlabel" text-anchor="middle">Пространственно-временная</text>

  <!-- ABSTRACT / yellow nodes -->
  <ellipse class="yellow" cx="262" cy="182" rx="84" ry="28"/>
  <text class="nodeText" x="262" y="182">
    <tspan x="262" dy="-8">Суммаризация</tspan>
    <tspan x="262" dy="18">видео в текст</tspan>
  </text>

  <ellipse class="yellow" cx="427" cy="133" rx="98" ry="18"/>
  <text class="nodeText" x="427" y="133">
    <tspan x="427" dy="0">Видео QA</tspan>
    <tspan x="427" dy="18"> </tspan>
  </text>

  <ellipse class="yellow" cx="421" cy="203" rx="70" ry="23"/>
  <text class="nodeText" x="421" y="203">
    <tspan x="421" dy="-7">Описание</tspan>
    <tspan x="421" dy="18">видео</tspan>
  </text>

  <ellipse class="yellow" cx="277" cy="276" rx="99" ry="28"/>
  <text class="nodeText" x="277" y="276">
    <tspan x="277" dy="-8">Сопоставление видео</tspan>
    <tspan x="277" dy="18">и текста</tspan>
  </text>

  <ellipse class="yellow" cx="243" cy="474" rx="66" ry="24"/>
  <text class="nodeText" x="243" y="474">
    <tspan x="243" dy="-7">Классификация</tspan>
    <tspan x="243" dy="18">видео</tspan>
  </text>

  <ellipse class="yellow" cx="402" cy="450" rx="78" ry="28"/>
  <text class="nodeText" x="402" y="450">
    <tspan x="402" dy="-8">Распознавание</tspan>
    <tspan x="402" dy="18">действий</tspan>
  </text>

  <!-- TEMPORAL / pink nodes -->
  <ellipse class="pink" cx="650" cy="132" rx="76" ry="24"/>
  <text class="nodeTextSmall" x="650" y="132">
    <tspan x="650" dy="-8">Локализация временных</tspan>
    <tspan x="650" dy="17">границ событий</tspan>
  </text>

  <ellipse class="pink" cx="590" cy="226" rx="77" ry="24"/>
  <text class="nodeTextSmall" x="590" y="226">
    <tspan x="590" dy="-8">Границы</tspan>
    <tspan x="590" dy="17">событий</tspan>
  </text>

  <ellipse class="pink" cx="751" cy="184" rx="64" ry="27"/>
  <text class="nodeTextSmall" x="751" y="184">
    <tspan x="751" dy="-8">Подробное описание</tspan>
    <tspan x="751" dy="17">видео</tspan>
  </text>

  <ellipse class="pink" cx="753" cy="244" rx="86" ry="23"/>
  <text class="nodeTextSmall" x="753" y="244">
    <tspan x="753" dy="-12">Временная</tspan>
    <tspan x="753" dy="15">локализация</tspan>
    <tspan x="753" dy="15">в видео</tspan>
  </text>

  <ellipse class="pink" cx="642" cy="293" rx="67" ry="25"/>
  <text class="nodeText" x="642" y="293">Поиск момента</text>

  <ellipse class="pink" cx="720" cy="359" rx="87" ry="24"/>
  <text class="nodeTextSmall" x="720" y="359">
    <tspan x="720" dy="-12">Кандидаты</tspan>
    <tspan x="720" dy="15">действий</tspan>
    <tspan x="720" dy="15">во времени</tspan>
  </text>

  <ellipse class="pink" cx="582" cy="428" rx="86" ry="24"/>
  <text class="nodeTextSmall" x="582" y="428">
    <tspan x="582" dy="-12">Временная</tspan>
    <tspan x="582" dy="15">локализация</tspan>
    <tspan x="582" dy="15">действий</tspan>
  </text>

  <ellipse class="pink" cx="577" cy="531" rx="75" ry="24"/>
  <text class="nodeText" x="577" y="531">
    <tspan x="577" dy="-8">Сокращение видео</tspan>
    <tspan x="577" dy="18">в более короткое</tspan>
  </text>

  <ellipse class="pink" cx="683" cy="590" rx="81" ry="24"/>
  <text class="nodeTextSmall" x="683" y="590">
    <tspan x="683" dy="-8">Поиск ключевых</tspan>
    <tspan x="683" dy="17">моментов видео</tspan>
  </text>

  <ellipse class="pink" cx="719" cy="489" rx="82" ry="22"/>
  <text class="nodeTextSmall" x="719" y="489">
    <tspan x="719" dy="-8">Границы</tspan>
    <tspan x="719" dy="17">общего события</tspan>
  </text>

  <!-- SPATIOTEMPORAL / blue nodes -->
  <ellipse class="blue" cx="980" cy="189" rx="96" ry="28"/>
  <text class="nodeTextSmall" x="980" y="189">
    <tspan x="980" dy="-12">Пространственно-</tspan>
    <tspan x="980" dy="15">временная</tspan>
    <tspan x="980" dy="15">локализация</tspan>
  </text>

  <ellipse class="blue" cx="1046" cy="261" rx="98" ry="28"/>
  <text class="nodeTextSmall" x="1046" y="261">
    <tspan x="1046" dy="-8">Поиск объекта</tspan>
    <tspan x="1046" dy="17">в видео</tspan>
  </text>

  <ellipse class="blue" cx="1028" cy="350" rx="66" ry="28"/>
  <text class="nodeTextSmall" x="1028" y="350">
    <tspan x="1028" dy="-12">Сегментация</tspan>
    <tspan x="1028" dy="15">экземпляров объектов</tspan>
    <tspan x="1028" dy="15">в видео</tspan>
  </text>

  <ellipse class="blue" cx="896" cy="405" rx="66" ry="28"/>
  <text class="nodeTextSmall" x="896" y="405">
    <tspan x="896" dy="-8">Сегментация</tspan>
    <tspan x="896" dy="17">объектов в видео</tspan>
  </text>

  <ellipse class="blue" cx="895" cy="472" rx="64" ry="27"/>
  <text class="nodeText" x="895" y="472">
    <tspan x="895" dy="-7">Отслеживание</tspan>
    <tspan x="895" dy="18">объектов</tspan>
  </text>

  <ellipse class="blue" cx="1020" cy="516" rx="47" ry="25"/>
  <text class="nodeText" x="1020" y="516">ReID</text>

  <ellipse class="blue" cx="1011" cy="587" rx="108" ry="25"/>
  <text class="nodeTextSmall" x="1011" y="587">
    <tspan x="1011" dy="-7">Обнаружение значимых</tspan>
    <tspan x="1011" dy="17">областей в видео</tspan>
  </text>
</svg>
