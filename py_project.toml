[project]
name = "hallucination-eval"
version = "0.1.0"
description = "Evaluation of hallucinations in VideoLLM"
requires-python = ">=3.9"


dependencies = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "transformers==4.41.2",
    "tokenizers==0.19.1",
    "accelerate==0.30.1",
    "safetensors==0.4.3",
    "sentencepiece==0.2.0",
    "protobuf==4.25.3",
    "datasets==2.19.1",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "PyYAML==6.0.1",
    "spacy==3.7.4",
    "nltk==3.8.1",
    "bert-score==0.3.13",
    "scikit-learn==1.5.0",
    "scipy==1.13.1",
    "tqdm==4.66.4",
    "rich==13.7.1",
    "loguru==0.7.2",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "ruff==0.4.8",
    "mypy==1.10.0",
    "jupyterlab==4.2.1",
    "matplotlib==3.9.0",
    "seaborn==0.13.2",
]
